<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>gym tracking</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<div class="wrap">
  <div class="motto" id="motto">
      <div class="bar" aria-hidden="true"></div>
      <p class="hi" lang="hi">आज की मेहनत, कल की पहचान है,</p>
      <p class="hi gold" lang="hi">फिट बॉडी ही तेरी शान है <span aria-hidden="true">💪🔥</span></p>
      <p class="en">Sweat today, shine tomorrow <span aria-hidden="true">✨</span></p>
    </div>
  <header class="top">
    <div class="lead">
      <img class="logo" src="logo.svg" alt="Gym Tracking" width="96" height="96">
      <h1 class="sr">Gym Tracking</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" data-act="tab" data-v="day"><span class="ti">01</span>Day</button>
      <button class="tab" role="tab" data-act="tab" data-v="week"><span class="ti">02</span>Week</button>
      <button class="tab" role="tab" data-act="tab" data-v="month"><span class="ti">03</span>Month</button>
      <button class="tab" role="tab" data-act="tab" data-v="habits"><span class="ti">04</span>Habits</button>
      <button class="tab" role="tab" data-act="tab" data-v="setup"><span class="ti">05</span>Setup</button>
    </nav>
    <div class="tools">
      <div class="sync" id="sync" data-s="local" role="status"><i></i><span id="syncTxt">Saved on this device</span></div>
      <select id="range" aria-label="Report period">
        <option value="today">Today only</option>
        <option value="week">This week</option>
        <option value="month" selected>This month</option>
        <option value="30">Last 30 days</option>
        <option value="all">All time</option>
      </select>
      <button class="btn ghost" id="sheetBtn" data-act="sheet">Today's sheet (PDF)</button>
      <button class="btn ghost" id="graphBtn" data-act="graphs">📊 Graphs PDF</button>
      <button class="btn" id="reportBtn" data-act="report">Download PDF report</button>
    </div>
  </header>
  <div class="dl" id="dl" hidden></div>
  <main id="app"><p class="empty">Loading Gym Tracking... If this message stays, your browser blocked scripts. Save the file to your phone's Downloads folder and open it from there in Chrome.</p></main>
</div>
<button class="fab" data-act="log" aria-label="Add a log entry"><span>+</span><b>Log</b></button>
<dialog class="lg" id="logDlg" aria-label="Log entry"><form id="logForm" autocomplete="off" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><div></div></div>

<noscript><p style="padding:16px;color:#f5f5f5;font-family:sans-serif">Gym Tracking needs JavaScript. Please turn it on in your browser.</p></noscript>
<script src="quotes.js"></script>
<script src="script.js"></script>
</body>
</html>
